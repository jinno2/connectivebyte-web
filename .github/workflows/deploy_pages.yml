name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils qpdf
      - run: npm test
      - uses: actions/configure-pages@v6
      # 公開対象を配信物のみに限定する（README・server.js・test 等の内部運用ファイルを含めない）
      - name: Prepare publish tree
        run: |
          mkdir -p _site
          cp index.html styles.css app.js logic.js share.js favicon.svg sitemap.xml _site/
          cp -r content _site/
      - name: Inspect publish tree
        env:
          PUBLICATION_ROOT: _site
        run: node --test test/publication-guard.test.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
